name: Publish tcgStock

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:35 Beijing time, ahead of the 07:00 simulated market open.
    - cron: '35 22 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            .cache/market
            public/card-images
          key: rifthunt-art-v1-${{ github.run_id }}
          restore-keys: rifthunt-art-v1-
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
